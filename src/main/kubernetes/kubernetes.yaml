apiVersion: apps/v1
kind: Deployment
metadata:
  name: embitious
  labels:
    app: embitious
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/q/metrics"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embitious
  template:
    metadata:
      labels:
        app: embitious
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
    spec:
      containers:
        - name: embitious
          image: embitious:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: QUARKUS_ARTEMIS_URL
              value: "tcp://artemis-broker:61616"
            - name: QUARKUS_ARTEMIS_USERNAME
              value: "artemis"
            - name: QUARKUS_ARTEMIS_PASSWORD
              value: "artemis"
            - name: EMBITIOUS_EMBEDDING_OFFLINE
              value: "false"
          # NOTE: Adjust memory/cpu based on the model size:
          # - all-MiniLM-L6-v2 (~90MB model): 2Gi should be sufficient
          # - all-mpnet-base-v2 (~420MB model): consider 4Gi+
          resources:
            limits:
              memory: "2Gi"
              cpu: "1000m"
            requests:
              memory: "1Gi"
              cpu: "500m"
          # Startup probe gives large models time to download and load on first start
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: embitious-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: embitious
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: embitious
  labels:
    app: embitious
spec:
  selector:
    app: embitious
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
