apiVersion: apps/v1
kind: Deployment
metadata:
  name: embitious
  labels:
    app: embitious
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embitious
  template:
    metadata:
      labels:
        app: embitious
    spec:
      containers:
        - name: embitious
          image: embitious:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_ARTEMIS_URL
              value: "tcp://artemis-broker:61616"
            - name: QUARKUS_ARTEMIS_USERNAME
              value: "artemis"
            - name: QUARKUS_ARTEMIS_PASSWORD
              value: "artemis"
            - name: EMBITIOUS_EMBEDDING_OFFLINE
              value: "false"
          resources:
            limits:
              memory: "2Gi"
              cpu: "1000m"
            requests:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: embitious
  labels:
    app: embitious
spec:
  selector:
    app: embitious
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
