# Embitious Vector Embedding Service Configuration

# HTTP Configurations
quarkus.http.port=8080
quarkus.http.root-path=/

# Artemis JMS Configurations
# Connection URL for the external message broker
quarkus.artemis.url=tcp://localhost:61616
# Connection credentials (optional/default)
quarkus.artemis.username=artemis
quarkus.artemis.password=artemis

# Custom Embedding configurations
# Model to use. By default we use the standard sentence-transformers all-MiniLM-L6-v2
embitious.embedding.model-name=sentence-transformers/all-MiniLM-L6-v2
# Offline execution: when true, forces DJL to run locally using native PyTorch binaries and cached models without any outbound API requests
embitious.embedding.offline=false

# JMS queue/topic configurations
embitious.jms.request-queue=embeddings.requests
embitious.jms.response-queue=embeddings.responses

# OpenAPI / Swagger UI Configuration
# Swagger UI is enabled only in dev mode for security; override with QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE=true in non-prod
%dev.quarkus.swagger-ui.always-include=true
quarkus.openapi.path=/openapi
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-openapi.info-title=Embitious Vector Embedding API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for computing text embeddings using Hugging Face sentence-transformers models
quarkus.smallrye-openapi.info-contact-email=dev@embitious.com

# Structured JSON logging (use console in dev, JSON in prod by default)
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.pretty-print=false

# Mask sensitive data in health endpoints
quarkus.smallrye-health.ui.enable=false
